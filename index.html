<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>User List</title>
</head>
<body>
  <header class="mb-5">
    <div class="container mt-5">
      <div class="d-flex justify-content-end">
        <div class="btn-group">
          <button class="btn btn-secondary btn-sm" data-bs-theme-value="dark">Dark</button>
          <button class="btn btn-light btn-sm" data-bs-theme-value="light">Light</button>
        </div>
      </div>
            <h1 class="mb-4">Users</h1>
      <div class="row">
        <div class="col-md-4">
          <input type="text" class="form-control form-control-lg" placeholder="Search Users">
        </div>
        <div class="col-md-8 user-menu d-flex justify-content-end align-items-center">
          <ul class="nav">
            <li class="nav-item"><a class="nav-link" href="#">Reputation</a></li>
            <li class="nav-item"><a class="nav-link text-bg-primary rounded-3" href="#">New Users</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Editors</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Moderators</a></li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/darkmodetoggle.js"></script>
</body>
</html>
